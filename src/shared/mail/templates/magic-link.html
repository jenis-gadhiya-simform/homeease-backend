<h1 style="font-size: 22px; margin: 0 0 16px">Your sign-in link</h1>
<p>
  Use the button below to sign in{{#if businessName}} to book with {{
  businessName }}{{/if}}.
</p>
<p>The link works once and expires in {{ expiresInMinutes }} minutes.</p>
<p style="margin: 24px 0">
  <a
    href="{{ actionUrl }}"
    style="
      background: #18181b;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
      display: inline-block;
    "
    >Sign in</a
  >
</p>
<p style="color: #71717a; font-size: 13px">
  If you didn't ask for this, you can ignore this email.
</p>
