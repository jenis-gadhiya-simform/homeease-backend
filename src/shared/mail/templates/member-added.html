<h1 style="font-size: 22px; margin: 0 0 16px">
  You've been added to {{ businessName }}
</h1>
<p>
  Hi {{ name }}, {{ addedBy }} added you to {{ businessName }} on SlotWise as
  {{ roleLabel }}. Sign in with your existing password and pick it from your
  businesses.
</p>
<p style="margin: 24px 0">
  <a
    href="{{ actionUrl }}"
    style="
      background: #18181b;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
      display: inline-block;
    "
    >Sign in</a
  >
</p>
