<h1 style="font-size: 22px; margin: 0 0 16px">
  Welcome to {{ businessName }}, {{ name }}!
</h1>
<p>
  {{ addedBy }} added you to {{ businessName }} on SlotWise as
  {{ roleLabel }}. Choose a password to sign in.
</p>
<p style="margin: 24px 0">
  <a
    href="{{ actionUrl }}"
    style="
      background: #18181b;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
      display: inline-block;
    "
    >Set your password</a
  >
</p>
<p style="color: #71717a; font-size: 13px">
  The link works once and expires in {{ expiresInHours }} hours. If it has
  expired, ask {{ addedBy }} for a new one.
</p>
